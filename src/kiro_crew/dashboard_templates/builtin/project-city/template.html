<!--
  project-city: the project report drawn as a 3D city.

  The same seven fields as project-report, read from window.kirocrew.fields: items,
  omitted, series and last_entry_at from the workstreams fold, and for_you, verdict and
  ci written by the crewmate. Each board's goal is a district, each round a street,
  each task a tower whose height is the credits its worker spent, and each subtask an
  annex behind its task. Every fact the city draws is also in the HTML under it.

  The rules are project-report's: a cost nobody reported is a dash (a hollow dashed
  tower in the city), never a zero; a cut list says how much it dropped; a worker that
  served two tasks is billed once in every roll-up; and a verdict written before the
  record last advanced reads as "No word yet".

  Every value reaches the page as text: textContent, a text node, or canvas fillText.
  The one message the page posts is kirocrew-dashboard:act, from a Needs-you button,
  which puts a line in the reader's chat box and sends nothing.

  The page's own words follow the reader's UI language, from one table (I18N): English,
  the default, and Simplified Chinese for a zh-CN reader. What the record or a crewmate
  wrote is shown as written. Always dark: the city is a night scene lit by emissive
  colour. It moves; under prefers-reduced-motion it draws one still frame, and the
  reader can start or stop the motion with the page's own button.

  The first script is three.js r134 (MIT; the license text is in THIRD-PARTY-NOTICES),
  cut down to the classes this page uses and minified as one IIFE that sets
  globalThis.THREE. scripts/build-project-city-three.mjs in the repository builds it from
  the three@0.134.0 npm package and checks this copy against a rebuild; its header states
  the recipe. No loader is in it, so it carries no network code. Two edits to three.js's
  own text: generateUUID, where crypto.randomUUID is missing, draws its four 32-bit
  numbers from crypto.getRandomValues instead of Math.random(); and three links in its
  shader comments name the linked repository's default branch as HEAD instead of by
  branch name. The second script is the page.
-->
<style>
  /* A night city: magenta, cyan and acid yellow on indigo-black. Always dark, because
     the 3D scene is lit by emissive colour that only reads on a dark ground and every
     panel sits over or beside that scene. The state colours here are the same hex values
     the scene paints with (COLOR in the script), so a tower and its row agree. */
  html, body { background: #0c0a1d; }
  .pc {
    color-scheme: dark;
    --pc-void: oklch(0.135 0.035 285);
    --pc-void-2: oklch(0.165 0.045 292);
    --pc-panel: oklch(0.185 0.045 289 / .93);
    --pc-panel-2: oklch(0.225 0.05 292 / .95);
    --pc-edge: oklch(0.46 0.1 305 / .7);
    --pc-ink: oklch(0.965 0.012 265);
    --pc-mute: oklch(0.79 0.035 275);
    --pc-pink: oklch(0.72 0.25 352);
    --pc-cyan: oklch(0.86 0.14 205);
    --pc-acid: oklch(0.93 0.2 118);
    --pc-red: oklch(0.71 0.21 22);
    --pc-mint: oklch(0.87 0.16 165);
    --pc-violet: oklch(0.79 0.14 300);
    --pc-cut: 14px;
    --pc-display: "Bahnschrift", "DIN Condensed", "DIN Alternate", "Avenir Next Condensed",
      "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --pc-body: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --pc-mono: "JetBrains Mono", "Cascadia Code", "SF Mono", "Fira Code", ui-monospace, Menlo,
      Consolas, "DejaVu Sans Mono", monospace;
    --pc-s2: 8px; --pc-s3: 12px; --pc-s4: 16px; --pc-s5: 24px; --pc-s6: 32px;
    --pc-fast: 140ms; --pc-ease: cubic-bezier(.16, 1, .3, 1);
    position: relative; min-height: 100dvh;
    padding: var(--pc-s4) clamp(12px, 2.4vw, 32px) var(--pc-s6);
    display: grid; gap: var(--pc-s4); align-content: start;
    font: 14px/1.5 var(--pc-body);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    color: var(--pc-ink);
    background: var(--pc-void);
    overflow-x: clip;
  }
  .pc *, .pc *::before, .pc *::after { box-sizing: border-box; }
  .pc [hidden] { display: none !important; }
  .pc button { font: inherit; color: inherit; }
  .pc :focus-visible { outline: 2px solid var(--pc-acid); outline-offset: 2px; }

  /* ---- cut-corner surfaces ---- */
  .pc-cut {
    position: relative;
    clip-path: polygon(var(--pc-cut) 0, 100% 0, 100% calc(100% - var(--pc-cut)),
      calc(100% - var(--pc-cut)) 100%, 0 100%, 0 var(--pc-cut));
  }
  .pc-cut::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: var(--pc-line, var(--pc-edge));
    clip-path: polygon(evenodd,
      var(--pc-cut) 0, 100% 0, 100% calc(100% - var(--pc-cut)), calc(100% - var(--pc-cut)) 100%,
      0 100%, 0 var(--pc-cut), var(--pc-cut) 0,
      calc(var(--pc-cut) + .42px) 1px, 1px calc(var(--pc-cut) + .42px), 1px calc(100% - 1px),
      calc(100% - var(--pc-cut) - .42px) calc(100% - 1px), calc(100% - 1px) calc(100% - var(--pc-cut) - .42px),
      calc(100% - 1px) 1px, calc(var(--pc-cut) + .42px) 1px);
  }

  /* ---- header ---- */
  .pc-top { display: grid; gap: var(--pc-s3); }
  .pc-titles { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--pc-s3) var(--pc-s5); }
  .pc-eyebrow { font-size: 12.5px; color: var(--pc-mute); }
  .pc-title {
    margin: 2px 0 0; font: 800 clamp(26px, 4.2vw, 44px)/1.05 var(--pc-display);
    font-stretch: condensed; letter-spacing: .02em; color: var(--pc-ink);
    text-shadow: 0 0 18px oklch(0.72 0.25 352 / .55), 0 0 2px oklch(0.72 0.25 352 / .9);
    overflow-wrap: anywhere;
  }
  .pc-live { display: flex; align-items: center; gap: var(--pc-s2); margin-top: 6px; font-size: 12.5px; color: var(--pc-mute); }
  .pc-live b { color: var(--pc-ink); font-weight: 600; }
  .pc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pc-mute); flex: none; }
  .pc-live[data-live="true"] .pc-dot { background: var(--pc-mint); box-shadow: 0 0 10px var(--pc-mint);
    animation: pc-beat 1.6s ease-in-out infinite; }
  @keyframes pc-beat { 50% { transform: scale(.6); opacity: .55; } }
  .pc-sentence { margin: 0 0 0 auto; font-size: 14px; color: var(--pc-mute); }
  .pc-sentence b { font: 700 18px/1 var(--pc-mono); color: var(--pc-ink); margin: 0 3px;
    text-shadow: 0 0 10px oklch(0.86 0.14 205 / .55); }
  .pc-pills { display: flex; flex-wrap: wrap; gap: var(--pc-s2); }
  .pc-pill { --pc-cut: 8px; cursor: pointer; border: 0; padding: 7px 14px; max-width: 280px;
    background: var(--pc-panel-2); color: var(--pc-mute); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--pc-fast), background var(--pc-fast); }
  .pc-pill:hover { color: var(--pc-ink); --pc-line: var(--pc-cyan); }
  .pc-pill[aria-current="true"] { background: var(--pc-pink); color: oklch(0.14 0.04 285); font-weight: 700; --pc-line: var(--pc-pink); }
  .pc-pill-n { font-family: var(--pc-mono); margin-left: 6px; opacity: .75; }

  /* ---- the 3D stage ---- */
  .pc-stage { position: relative; display: grid; }
  .pc-stage > * { grid-area: 1 / 1; min-width: 0; }
  .pc-canvas-box { --pc-cut: 22px; position: relative; height: clamp(380px, 62svh, 760px);
    background: var(--pc-void-2); }
  .pc-canvas-box canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important;
    z-index: 0; touch-action: pan-y; }
  .pc-canvas-box[data-gl="off"] { display: grid; place-items: center; }
  .pc-nogl { position: relative; z-index: 2; max-width: 46ch; margin: 0; padding: var(--pc-s4); color: var(--pc-mute); text-align: center; }
  .pc-hud { position: relative; z-index: 10; pointer-events: none; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--pc-s3) var(--pc-s4); padding: var(--pc-s4); }
  .pc-hud > * { pointer-events: auto; }
  .pc-legend { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: 520px;
    font-size: 12px; color: var(--pc-mute); padding: 6px 10px; background: oklch(0.14 0.04 285 / .88); }
  .pc-legend:empty { display: none; }
  .pc-legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px;
    background: var(--c); box-shadow: 0 0 8px var(--c); }
  .pc-legend i.pc-wire { background: transparent; outline: 1px dashed var(--c); box-shadow: none; }
  .pc-legend i.pc-ringed { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c), 0 0 6px var(--c); }
  .pc-legend-k { color: var(--pc-ink); font-weight: 650; }
  .pc-kpis { grid-column: 2; grid-row: 1 / span 2; align-self: start; display: grid; gap: var(--pc-s2); width: 232px; }
  .pc-kpi { --pc-cut: 10px; padding: 10px 12px; background: var(--pc-panel); display: grid;
    grid-template-columns: 1fr auto; align-items: end; gap: 2px 8px; }
  .pc-kpi-l { grid-column: 1 / -1; font-size: 12px; color: var(--pc-mute); }
  .pc-kpi-v { font: 700 30px/1 var(--pc-mono); color: var(--pc-ink); text-shadow: 0 0 14px var(--kc, var(--pc-cyan)); }
  .pc-kpi-v small { font: 500 12px var(--pc-body); color: var(--pc-mute); margin-left: 4px; text-shadow: none; }
  .pc-kpi-s { grid-column: 1 / -1; font-size: 12px; color: var(--kc, var(--pc-cyan)); }
  .pc-kpi-s.pc-quiet { color: var(--pc-mute); }
  .pc-kpi-bar { grid-column: 1 / -1; height: 4px; margin-top: 4px; background: oklch(0.32 0.05 290); }
  .pc-kpi-bar > i { display: block; height: 100%; background: var(--pc-mint); box-shadow: 0 0 8px var(--pc-mint); }
  .pc-vslot { grid-column: 1; grid-row: 3; align-self: end; justify-self: start; max-width: 620px; min-width: 0; }
  .pc-verdict { --pc-cut: 16px; padding: 14px 16px; background: var(--pc-panel); --pc-line: var(--vc); display: grid; gap: 4px; }
  .pc-verdict-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .pc-verdict-k { flex-basis: 100%; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pc-mute); }
  .pc-verdict-state { font: 800 30px/1 var(--pc-display); font-stretch: condensed; letter-spacing: .03em; color: var(--vc);
    text-shadow: 0 0 16px var(--vc); }
  .pc-verdict-meta { display: flex; gap: var(--pc-s2); align-items: center; font-size: 12px; color: var(--pc-mute); }
  .pc-verdict-head { font-size: 15.5px; font-weight: 600; color: var(--pc-ink); overflow-wrap: anywhere; }
  .pc-verdict-block { font-size: 13px; color: var(--pc-mute); overflow-wrap: anywhere; }
  .pc-verdict-block b { color: var(--vc); font-weight: 600; }
  .pc-ctrl { grid-column: 2; grid-row: 3; align-self: end; justify-self: end; display: flex; flex-wrap: wrap; gap: 6px; }
  .pc-btn { --pc-cut: 7px; border: 0; cursor: pointer; padding: 6px 12px; font-size: 12.5px;
    background: oklch(0.2 0.05 290 / .9); color: var(--pc-ink); --pc-line: var(--pc-cyan);
    transition: background var(--pc-fast), color var(--pc-fast); }
  .pc-btn:hover { background: oklch(0.3 0.08 205 / .9); }
  .pc-btn[aria-pressed="true"] { background: var(--pc-cyan); color: oklch(0.14 0.04 285); font-weight: 700; }
  .pc-tip { position: absolute; z-index: 20; pointer-events: none; max-width: 300px; padding: 8px 10px; --pc-cut: 8px;
    background: oklch(0.12 0.03 285 / .96); --pc-line: var(--tc, var(--pc-cyan)); font-size: 12.5px; line-height: 1.45;
    transform: translate(14px, 14px); }
  .pc-tip b { display: block; color: var(--pc-ink); font-size: 13px; }
  .pc-tip span { color: var(--pc-mute); }
  .pc-tip em { font-style: normal; color: var(--tc, var(--pc-cyan)); font-family: var(--pc-mono); }

  /* ---- bands under the stage ---- */
  .pc-stale { --pc-cut: 10px; padding: 10px 14px; background: oklch(0.3 0.12 60 / .35); --pc-line: oklch(0.8 0.15 70);
    color: var(--pc-ink); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .pc-stale b { color: oklch(0.88 0.15 80); }
  .pc-stale i { font-style: normal; color: var(--pc-mute); font-family: var(--pc-mono); font-size: 12px; }
  .pc-lanes { --pc-cut: 12px; padding: 12px 14px; background: oklch(0.2 0.06 15 / .9); --pc-line: oklch(0.71 0.21 22 / .8);
    display: grid; gap: 6px; }
  .pc-lanes-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .pc-lanes-h b { font: 800 18px var(--pc-display); color: var(--pc-red); text-shadow: 0 0 10px oklch(0.71 0.21 22 / .7); }
  .pc-lanes-h span { font: 12.5px var(--pc-mono); color: var(--pc-mute); }
  .pc-lane { display: grid; grid-template-columns: 18px minmax(120px, 220px) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 13px; }
  .pc-lane-m { font-family: var(--pc-mono); font-weight: 700; }
  .pc-lane-n { font-family: var(--pc-mono); color: var(--pc-ink); overflow-wrap: anywhere; }
  .pc-lane-w { color: var(--pc-mute); overflow-wrap: anywhere; }
  .pc-lane-o { font-size: 12.5px; color: var(--pc-ink); white-space: nowrap; }

  /* ---- the grid of panels ---- */
  .pc-grid { display: grid; gap: var(--pc-s4); grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
  .pc-grid > * { grid-column: 1 / -1; min-width: 0; }
  @media (min-width: 1080px) {
    .pc-grid > .pc-w5 { grid-column: span 5; }
    .pc-grid > .pc-w7 { grid-column: span 7; }
  }
  .pc-panel { padding: 14px 16px 16px; background: var(--pc-panel); }
  .pc-ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
  .pc-pt { margin: 0; font: 800 18px/1.2 var(--pc-display); font-stretch: condensed; letter-spacing: .04em; color: var(--pc-cyan);
    text-shadow: 0 0 12px oklch(0.86 0.14 205 / .45); }
  .pc-pc { font-size: 12.5px; color: var(--pc-mute); }
  .pc-empty { margin: 0; color: var(--pc-mute); font-size: 13.5px; }
  .pc-empty + .pc-empty { margin-top: 6px; }
  .pc-held { margin-top: 8px; font-size: 12.5px; color: var(--pc-mute); }
  .pc-agent { display: inline-block; padding: 0 7px; font: 600 11px/1.7 var(--pc-mono); color: var(--pc-violet);
    background: oklch(0.79 0.14 300 / .14); }

  /* ---- cost line and the hourly chart ---- */
  .pc-cost { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .pc-cost-l { font-size: 14px; color: var(--pc-mute); }
  .pc-cost-l b { font: 700 26px/1 var(--pc-mono); color: var(--pc-ink); margin: 0 4px; text-shadow: 0 0 14px oklch(0.72 0.25 352 / .7); }
  .pc-cost-t { color: var(--pc-mute); }
  .pc-cost .pc-btn { margin-left: auto; }
  .pc-chart { margin-top: 12px; }
  .pc-plot { width: 100%; min-height: 170px; }
  .pc-plot svg { display: block; overflow: visible; }
  .pc-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--pc-mute); margin-top: 6px; }
  .pc-key i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

  /* ---- the needs-you desk ---- */
  .pc-desk { display: grid; gap: 14px; }
  .pc-shelf-h { font-size: 12.5px; color: var(--pc-acid); margin-bottom: 8px; }
  .pc-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  .pc-card { --pc-cut: 12px; --pc-line: color-mix(in oklab, var(--kc) 70%, transparent); padding: 12px 14px 14px;
    background: var(--pc-panel-2); box-shadow: inset 0 2px 0 color-mix(in oklab, var(--kc) 60%, transparent);
    display: grid; gap: 7px; align-content: start; transition: opacity var(--pc-fast), transform var(--pc-fast); }
  .pc-card.pc-going { opacity: 0; transform: scale(.97); }
  .pc-kind { justify-self: start; padding: 1px 9px; font: 700 12px/1.7 var(--pc-body); color: oklch(0.14 0.04 285); background: var(--kc);
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .pc-card-t { font-size: 15px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .pc-brief { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
  .pc-brief dt { color: var(--kc); }
  .pc-brief dd { margin: 0; color: var(--pc-ink); overflow-wrap: anywhere; }
  .pc-why { font-size: 13px; color: var(--pc-ink); overflow-wrap: anywhere; }
  .pc-raw { font-size: 12.5px; color: var(--pc-mute); }
  .pc-raw summary { cursor: pointer; color: var(--pc-mute); }
  .pc-raw div { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pc-where { font-size: 12.5px; color: var(--pc-mute); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pc-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pc-opt { --pc-cut: 6px; border: 0; cursor: pointer; padding: 5px 12px; font-size: 13px; background: oklch(0.16 0.04 288);
    color: var(--pc-ink); --pc-line: color-mix(in oklab, var(--kc) 75%, transparent); transition: background var(--pc-fast); }
  .pc-opt:hover { background: color-mix(in oklab, var(--kc) 22%, oklch(0.16 0.04 288)); }
  .pc-opt.pc-rec { background: var(--kc); color: oklch(0.14 0.04 285); font-weight: 700; }
  .pc-opt.pc-own { --pc-line: var(--pc-mute); color: var(--pc-mute); }
  .pc-opt-cell { display: inline-grid; gap: 3px; justify-items: start; max-width: 230px; }
  .pc-opt-hint { font-size: 11.5px; line-height: 1.3; color: var(--pc-mute); }
  .pc-opt-note { margin-top: 6px; font-size: 11.5px; color: var(--pc-mute); }
  .pc-fold summary { cursor: pointer; font-size: 13px; color: var(--pc-mute); padding: 4px 0; }
  .pc-sent { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 6px 0; font-size: 13px;
    border-bottom: 1px solid oklch(0.46 0.1 305 / .3); }
  .pc-sent span { color: var(--pc-cyan); }
  .pc-sent button { margin-left: auto; border: 0; background: none; color: var(--pc-mute); cursor: pointer; text-decoration: underline; }

  /* ---- who is working ---- */
  .pc-crew { display: grid; gap: 2px; }
  .pc-crew-r { display: grid; grid-template-columns: 10px 78px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 8px 6px; cursor: pointer; border-bottom: 1px solid oklch(0.46 0.1 305 / .22); transition: background var(--pc-fast); }
  .pc-crew-r:hover { background: oklch(0.3 0.08 300 / .35); }
  .pc-crew-dot { width: 10px; height: 10px; background: var(--rc); box-shadow: 0 0 10px var(--rc); transform: rotate(45deg); }
  .pc-crew-r[data-state="progress"] .pc-crew-dot { animation: pc-beat 1.8s ease-in-out infinite; }
  .pc-crew-who { font: 12.5px var(--pc-mono); color: var(--pc-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-crew-t { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-crew-said { font-size: 12.5px; color: var(--pc-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-crew-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .pc-crew-st { font-size: 12.5px; color: var(--rc); font-weight: 700; white-space: nowrap; }

  /* ---- chips and pills shared by the tree, the pipeline and the drawer ---- */
  .pc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; font: 12px/1.75 var(--pc-mono);
    color: var(--pc-mute); background: oklch(0.28 0.05 290 / .7); white-space: nowrap; }
  .pc-chip.pc-pass { color: var(--pc-mint); background: oklch(0.87 0.16 165 / .12); }
  .pc-chip.pc-fail { color: var(--pc-red); background: oklch(0.71 0.21 22 / .14); }
  .pc-chip.pc-run { color: var(--pc-cyan); background: oklch(0.86 0.14 205 / .12); }
  .pc-chip.pc-quietc { color: var(--pc-pink); background: oklch(0.72 0.25 352 / .14); }
  .pc-vp { display: inline-flex; padding: 0 8px; font: 700 12px/1.75 var(--pc-body); color: var(--pcc); white-space: nowrap;
    background: color-mix(in oklab, var(--pcc) 16%, transparent); }

  /* ---- the work tree ---- */
  .pc-tree-wrap { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1080px) { .pc-tree-wrap { grid-template-columns: minmax(0, 1fr) 320px; } }
  .pc-tree { display: grid; gap: 2px; min-width: 0; }
  .pc-n { min-width: 0; }
  .pc-n-h { display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; gap: 8px; align-items: center;
    padding: 6px; border-bottom: 1px solid oklch(0.46 0.1 305 / .2); transition: background var(--pc-fast); }
  .pc-n-h[role="button"] { cursor: pointer; }
  .pc-n-h:hover { background: oklch(0.3 0.08 300 / .3); }
  .pc-chev { color: var(--pc-cyan); font-size: 12px; transition: transform var(--pc-fast) var(--pc-ease); }
  .pc-n[data-open="true"] > .pc-n-h .pc-chev { transform: rotate(90deg); }
  .pc-lv { padding: 0 6px; font: 600 11px/1.7 var(--pc-mono); color: var(--lc); background: color-mix(in oklab, var(--lc) 14%, transparent); white-space: nowrap; }
  .pc-n-x { min-width: 0; }
  .pc-n-t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-n-epic > .pc-n-h .pc-n-t { font-size: 15px; color: var(--pc-ink); }
  .pc-n-t[role="button"] { cursor: pointer; text-decoration: underline dotted oklch(0.86 0.14 205 / .6); text-underline-offset: 3px; }
  .pc-n-s { font-size: 12px; color: var(--pc-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-n-r { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
  .pc-n-done { font: 12.5px var(--pc-mono); color: var(--pc-ink); }
  .pc-n-bar { width: 64px; height: 4px; background: oklch(0.32 0.05 290); }
  .pc-n-bar > i { display: block; height: 100%; background: var(--pc-mint); box-shadow: 0 0 6px var(--pc-mint); }
  .pc-n-cr { min-width: 46px; text-align: right; font: 700 13px var(--pc-mono); color: var(--pc-pink); }
  .pc-kids { display: none; margin-left: 14px; padding-left: 10px; border-left: 1px solid oklch(0.86 0.14 205 / .25); }
  .pc-n[data-open="true"] > .pc-kids { display: grid; gap: 2px; }
  .pc-flash > .pc-n-h { animation: pc-flash 1.6s ease-out 1; }
  @keyframes pc-flash { from { background: oklch(0.93 0.2 118 / .25); } to { background: transparent; } }

  /* ---- the two rings at the city centre, as rows ---- */
  .pc-rings { display: grid; gap: 10px; align-content: start; }
  .pc-rings-k { font-size: 12px; color: var(--pc-mute); }
  .pc-rows { display: grid; gap: 8px; }
  .pc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
  .pc-row-n { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-row-n i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; background: var(--sc); box-shadow: 0 0 8px var(--sc); }
  .pc-row-s { font-size: 12px; color: var(--pc-mute); }
  .pc-row-p { font: 700 13px var(--pc-mono); }

  /* ---- one epic: where the work stops ---- */
  .pc-pipe { display: grid; gap: 8px; }
  .pc-pipe-h { display: flex; gap: 10px; align-items: baseline; }
  .pc-pipe-h b { font: 800 16px var(--pc-display); color: var(--pc-mint); }
  .pc-pipe-h span { font: 13px var(--pc-mono); color: var(--pc-mute); }
  .pc-pipe-bar { height: 6px; background: oklch(0.32 0.05 290); }
  .pc-pipe-bar > i { display: block; height: 100%; background: var(--pc-mint); box-shadow: 0 0 10px var(--pc-mint); }
  .pc-stage-h { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--pc-cyan); }
  .pc-gate { font-size: 12px; color: var(--pc-violet); }
  .pc-pipe-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 5px 0;
    border-bottom: 1px solid oklch(0.46 0.1 305 / .2); }
  .pc-pipe-t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-pipe-w { font-size: 12px; color: var(--pc-mute); }

  /* ---- the drawer ---- */
  .pc-dr-back { position: fixed; inset: 0; z-index: 70; background: oklch(0.08 0.03 285 / .55); }
  .pc-dr { position: fixed; z-index: 71; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); overflow-y: auto;
    --pc-cut: 18px; --pc-line: var(--pc-cyan); background: oklch(0.16 0.045 289 / .98); padding: 18px 18px 28px; display: grid; gap: 14px; align-content: start; }
  .pc-dr-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
  .pc-dr-t { margin: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .pc-dr-s { font-size: 12.5px; color: var(--pc-mute); }
  .pc-dr-x { --pc-cut: 6px; border: 0; cursor: pointer; width: 34px; height: 34px; background: oklch(0.24 0.06 290); color: var(--pc-ink); --pc-line: var(--pc-pink); }
  .pc-dr-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pc-dr-sec { display: grid; gap: 4px; }
  .pc-dr-k { font-size: 12.5px; font-weight: 700; color: var(--pc-cyan); }
  .pc-dr-v { font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .pc-dr-none { font-size: 13px; color: var(--pc-mute); }
  .pc-dr-e { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 4px 0;
    border-bottom: 1px solid oklch(0.46 0.1 305 / .2); }
  .pc-dr-e-m { font-family: var(--pc-mono); color: var(--pc-mute); }
  .pc-dr-e-k { font-size: 12px; color: var(--pc-mute); }

  /* ---- the accounting line ---- */
  .pc-note { margin: 0; font-size: 12.5px; color: var(--pc-mute); }

  /* ---- narrow frames: the HUD drops under the city instead of covering it ---- */
  @media (max-width: 760px) {
    .pc-canvas-box { height: 320px; }
    .pc-hud { grid-area: 2 / 1; padding: var(--pc-s3) 0 0; grid-template-columns: minmax(0, 1fr); }
    .pc-legend, .pc-kpis, .pc-vslot, .pc-ctrl { grid-column: 1; grid-row: auto; }
    .pc-vslot { order: -1; max-width: none; }
    .pc-kpis { width: auto; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .pc-ctrl { justify-self: start; order: -2; }
    .pc-sentence { margin-left: 0; }
    .pc-lane { grid-template-columns: 18px minmax(0, 1fr); }
    .pc-lane-w, .pc-lane > .pc-lane-o { grid-column: 2; }
    .pc-n-h { grid-template-columns: 16px auto minmax(0, 1fr); }
    .pc-n-r { grid-column: 2 / -1; justify-content: flex-start; }
    .pc-crew-r { grid-template-columns: 10px minmax(0, 1fr) auto; }
    .pc-crew-who { display: none; }
  }

  /* Motion is decoration: with it off the page reads the same. The script stops the
     city's own loop on the same query. */
  @media (prefers-reduced-motion: reduce) {
    .pc *, .pc *::before, .pc *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="pc" id="pc">
  <header class="pc-top">
    <div class="pc-titles">
      <div>
        <div class="pc-eyebrow" id="pc-eyebrow" data-i18n="doing">What this crewmate is doing</div>
        <h1 class="pc-title" id="pc-title" data-i18n="page_title">Project city</h1>
        <!-- Whether the page is being fed, and as of when. Under the title: it qualifies
             every number below it. -->
        <div class="pc-live" id="pc-live" data-live="false" hidden><i class="pc-dot" aria-hidden="true"></i><span id="pc-live-t"></span></div>
      </div>
      <p class="pc-sentence" id="pc-sentence"></p>
    </div>
    <nav class="pc-pills" id="pc-pills" aria-label="Workstreams" data-i18n-label="aria_pills"></nav>
  </header>

  <!-- The band that says the record stopped advancing, above everything it qualifies. -->
  <div id="pc-stale-host"></div>

  <section class="pc-stage" id="pc-stage" aria-label="The work drawn as a city" data-i18n-label="aria_stage">
    <!-- The canvas goes here. This line is what a reader sees when no script runs. -->
    <div class="pc-canvas-box pc-cut" id="pc-city"><p class="pc-nogl" id="pc-city-wait" data-i18n="city_wait">The 3D city draws when the page's script runs. The numbers below come from the same record.</p></div>
    <div class="pc-hud">
      <div class="pc-legend pc-cut" id="pc-legend"></div>
      <div class="pc-kpis" id="pc-kpis"></div>
      <div class="pc-vslot" id="pc-verdict-host"></div>
      <div class="pc-ctrl" id="pc-ctrl" hidden></div>
    </div>
  </section>

  <div id="pc-lanes-host"></div>
  <main class="pc-grid" id="pc-view"></main>

  <!-- One bound element per field: the host fills each with the raw value, then the
       script rewrites each as words. The nouns are inside the spans because only the
       script knows the count they have to agree with. -->
  <p class="pc-note" id="pc-note">
    <span data-dashboard-field="items">&mdash;</span>,
    <span data-dashboard-field="omitted">&mdash;</span>,
    <span data-dashboard-field="series">&mdash;</span>,
    <span data-dashboard-field="for_you">&mdash;</span>,
    <span data-dashboard-field="verdict">&mdash;</span>,
    <span data-dashboard-field="ci">&mdash;</span>,
    <span data-dashboard-field="last_entry_at">&mdash;</span>.
  </p>

  <!-- One task's own record, opened from a tower, a tree row or a worker row. -->
  <div id="pc-drawer-host"></div>
</div>

vec2 DFGApprox( const in vec3 normal, const in vec3 viewDir, const in float roughness ) {

  // ------------------------------------------------------------------ the tree

  // ------------------------------------------------------------------ needs you

  //: The desk's words are W(key), in parts/i18n.js: a crewmate's verdict.words first, then

  // ------------------------------------------------------------------ who is working

  // ------------------------------------------------------------------ the city

    }
    function clip(s, n) { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }
    function glowSprite(colorHex, size, opacity) {
      var m = keep(new T.SpriteMaterial({ map: GLOW, color: new T.Color(colorHex), blending: T.AdditiveBlending,
        transparent: true, depthWrite: false, opacity: opacity }));

    //: A material whose opacity follows the district's dimming.
    function track(mats, m, o) { m.userData.o = o; m.userData.k = 1; m.opacity = o; mats.push(m); return m; }
    function dimOf(m) { return m.userData && typeof m.userData.k === 'number' ? m.userData.k : 1; }
    function basic(opts) { return keep(new T.MeshBasicMaterial(opts)); }
    function lineMat(colorHex) { return keep(new T.LineBasicMaterial({ color: new T.Color(colorHex), transparent: true })); }

    function buildDistrict(p, heightOf) {
      var epic = p.epic, colorHex = EPIC_COLORS[p.i % EPIC_COLORS.length];
      var g = new T.Group();
      var u = new T.Vector3(Math.sin(p.a), 0, -Math.cos(p.a));
      g.position.set(u.x * p.r, 0, u.z * p.r);
      g.rotation.y = Math.PI - p.a;
      content.add(g);
      var d = { focus: epic.focus, center: g.position.clone(), u: u, w: p.w, d: p.d, mats: [], picks: [], flows: [] };
      districts.push(d);

      // the plate: a cut-corner pad with a lit rim
      var hw = p.w / 2 + 0.7, hd = p.d / 2 + 0.7, cut = 0.9;
      var shape = new T.Shape();
      shape.moveTo(-hw + cut, -hd); shape.lineTo(hw, -hd); shape.lineTo(hw, hd - cut); shape.lineTo(hw - cut, hd);
      shape.lineTo(-hw, hd); shape.lineTo(-hw, -hd + cut); shape.lineTo(-hw + cut, -hd);
      var pad = new T.Mesh(keep(new T.ShapeGeometry(shape)), track(d.mats, basic({
        color: new T.Color(colorHex), transparent: true, blending: T.AdditiveBlending, depthWrite: false }), 0.07));
      pad.rotation.x = -Math.PI / 2;
      pad.position.y = 0.03;
      g.add(pad);
      var rimPts = shape.getPoints().map(function (v) { return new T.Vector3(v.x, 0.05, -v.y); });
      g.add(new T.LineLoop(keep(new T.BufferGeometry().setFromPoints(rimPts)), track(d.mats, lineMat(colorHex), 0.95)));

      // street lines between rounds
      for (var s = 1; s < p.rows; s++) {
        var z = -p.d / 2 + s * CELL;
        g.add(new T.Line(keep(new T.BufferGeometry().setFromPoints([
          new T.Vector3(-p.w / 2, 0.05, z), new T.Vector3(p.w / 2, 0.05, z)])), track(d.mats, lineMat(colorHex), 0.3)));
      }

      // towers, and each task's subtasks as annexes behind it
      epic.kids.forEach(function (story, ri) {
        var z0 = -p.d / 2 + CELL * (ri + 0.5);
        story.kids.forEach(function (tn, j) {
          var x0 = (j - (p.cols - 1) / 2) * CELL;
          var hasSubs = tn.kids.length > 0;
          addTower(d, g, tn, x0, hasSubs ? z0 - 0.42 : z0, FOOT, false, epic.name, heightOf);
          tn.kids.forEach(function (sn, k) {
            if (k >= 12) return;
            addTower(d, g, sn, x0 + ((k % 4) - 1.5) * 0.64, z0 + 0.72 + Math.floor(k / 4) * 0.62, SUBF, true, epic.name, heightOf);
          });
        });
      });

      // the sign on its pole at the back edge
      var pole = new T.Mesh(keep(new T.CylinderGeometry(0.05, 0.05, 6.2, 8)),
        track(d.mats, basic({ color: new T.Color(colorHex), transparent: true }), 0.75));
      pole.position.set(0, 3.1, p.d / 2 + 0.9);
      g.add(pole);
      var sign = textSprite([clip(epic.name, 30), i18n('sign_line', { a: epic.done, n: epic.total,
        c: fmtCr(billTotal(epic.bill)) })], colorHex, 1.15 + 0.05 * Math.max(p.w, p.d));
      sign.position.set(0, 6.9, p.d / 2 + 0.9);
      track(d.mats, sign.material, 1);
      g.add(sign);

      // reports flowing in to the plaza, as many as the district has open work
      var open = 0;
      (function count(ns) { ns.forEach(function (n) { if (n.task && txt(n.task.state) === 'open') open++; count(n.kids); }); }(epic.kids));
      g.updateMatrixWorld(true);

      // What the whole-city view must keep in sight: the plate's corners at the ground
      // and at the tallest a tower stands (0.9 + 5.8), and the sign by its own size.
      [-hw, hw].forEach(function (x) {
        [-hd, hd].forEach(function (z) {
          framePts.push({ p: g.localToWorld(new T.Vector3(x, 0, z)) });
          framePts.push({ p: g.localToWorld(new T.Vector3(x, 6.7, z)) });
        });
      });
      sign.userData.wp = g.localToWorld(sign.position.clone());
      framePts.push({ p: sign.userData.wp, sx: sign.scale.x, sy: sign.scale.y });
      labels.push(sign);
      var start = g.localToWorld(new T.Vector3(0, 0, -p.d / 2 - 0.8));
      var end = new T.Vector3(start.x, 0, start.z).setLength(PLAZA - 0.6);
      var n = Math.min(26, 6 + open * 3);
      var geo = keep(new T.BufferGeometry());
      geo.setAttribute('position', new T.Float32BufferAttribute(new Float32Array(n * 3), 3));
      var pm = track(d.mats, keep(new T.PointsMaterial({ size: 0.42, map: GLOW, color: new T.Color(colorHex),
        transparent: true, blending: T.AdditiveBlending, depthWrite: false })), 0.95);
      var pts = new T.Points(geo, pm);
      content.add(pts);
      var f = { geo: geo, points: pts, n: n, p: [], v: [], sx: start.x, sz: start.z, ex: end.x, ez: end.z };
      for (var i = 0; i < n; i++) { f.p.push(rand()); f.v.push(0.1 + rand() * 0.14); }
      flows.push(f);
      d.flows.push(f);
      // placed once, so a still frame shows them too
      var arr = geo.attributes.position.array;
      for (i = 0; i < n; i++) {
        arr[i * 3] = f.sx + (f.ex - f.sx) * f.p[i];
        arr[i * 3 + 1] = 0.22 + Math.sin(f.p[i] * Math.PI) * 0.9;
        arr[i * 3 + 2] = f.sz + (f.ez - f.sz) * f.p[i];
      }
    }

    function addTower(d, parent, n, x, z, foot, sub, epicName, heightOf) {
      var t = n.task;
      var look = taskLook(t);
      var spec = TASK_LOOK[look];
      var col = new T.Color(spec.color);
      var c = credits(t);
      var measured = c !== null;
      var h = heightOf(c, sub);
      var dim = look === 'closed';
      var g = new T.Group();
      g.position.set(x, 0, z);
      parent.add(g);

      var tex = keep(WIN.clone());
      tex.needsUpdate = true;
      tex.repeat.set(foot > 1 ? 1 : 0.5, Math.max(1, Math.round(h * 1.15)));
      var bodyMat = keep(new T.MeshStandardMaterial({ color: 0x110d28, metalness: 0.55, roughness: 0.34,
        emissive: col, emissiveMap: tex, emissiveIntensity: dim ? 0.32 : (measured ? 1.0 : 0.25), transparent: true,
        depthWrite: measured }));

        edges.scale.copy(body.scale);

        // never mistaken for a cheap one.

        edges = new T.LineSegments(eg, track(d.mats, keep(new T.LineDashedMaterial({ color: col, dashSize: 0.16,
          gapSize: 0.12, transparent: true })), 0.95));
        edges.computeLineDistances();
      }
      g.add(edges);

      var cap = new T.Mesh(CAP, track(d.mats, basic({ color: col, transparent: true }), dim ? 0.45 : 0.95));
      cap.scale.set(foot * 1.05, 1, foot * 1.05);
      cap.position.y = h;
      g.add(cap);
      var halo = glowSprite(spec.color, foot * (sub ? 2.6 : 2.3), dim ? 0.18 : 0.6);
      track(d.mats, halo.material, dim ? 0.18 : 0.6);
      halo.position.y = h + 0.12;
      g.add(halo);

      // A beam and a ring over a task that needs a person; a blocked one blinks.
      if (look === 'question' || look === 'blocked') {
        var beam = new T.Mesh(BEAM, track(d.mats, basic({ color: col, transparent: true,
          blending: T.AdditiveBlending, depthWrite: false }), 0.32));
        beam.position.y = h;
        g.add(beam);
        var ring = new T.Mesh(HALO_RING, track(d.mats, basic({ color: col, transparent: true,
          blending: T.AdditiveBlending, depthWrite: false }), 0.8));
        ring.rotation.x = -Math.PI / 2;

        var base = foot * 0.95;

      }
      // A light strip climbing a tower whose worker is at work.
      if (look === 'working') {
        var strip = new T.Mesh(STRIP, track(d.mats, basic({ color: col, transparent: true,
          blending: T.AdditiveBlending, depthWrite: false }), 0.9));
        strip.scale.set(foot * 1.08, 1, foot * 1.08);

      }

      var key = taskKey(n.boardId, t);
      body.userData = {
        kind: 'task',
        info: function () {

          var lines = [[word], [sub ? i18n('tip_sub') + DOT + epicName : epicName]];
          lines.push([i18n('tip_spent'), measured ? i18n('n_credits', { c: fmtCr(c) }) : i18n('tip_no_cost')]);
          if (txt(t.pr)) lines.push(['PR', '#' + txt(t.pr).replace(/^#/, '')]);
          var q = sinceMs(t.last_report_at);
          if (q !== null && txt(t.state) === 'open') lines.push([i18n('tip_last_report'), fmtAgo(q)]);
          return { title: txt(t.title) || DASH, color: spec.color, lines: lines };
        },
        hover: function () { halo.scale.multiplyScalar(1.7); edges.material.color.set(0xffffff); },
        unhover: function () { halo.scale.multiplyScalar(1 / 1.7); edges.material.color.copy(col); },
        click: function () { hooks.openTask(key); }

      pickables.push(body);
      d.picks.push(body);
      n.mesh = g;
      n.h = h;

    function addDrone(roots, r) {

      (function find(ns) {

          find(n.kids);

      var st = crewState(r.t);

      m.position.set(mode === 'orbit' ? dr.r : 0, dr.y, 0);

    function buildRings(roots) {
      var base = new T.Group();
      content.add(base);
      var plaza = new T.Mesh(keep(new T.CircleGeometry(PLAZA - 0.4, 72)),
        keep(new T.MeshStandardMaterial({ color: 0x120d2c, metalness: 0.7, roughness: 0.4, emissive: 0x1a0f3a, emissiveIntensity: 0.6 })));
      plaza.rotation.x = -Math.PI / 2;
      plaza.position.y = 0.02;
      base.add(plaza);
      [[PLAZA - 0.55, PLAZA - 0.35, COLOR.cyan, 0.9], [1.05, 1.22, COLOR.pink, 0.95], [3.0, 3.06, COLOR.violet, 0.5]].forEach(function (r) {
        var ring = new T.Mesh(keep(new T.RingGeometry(r[0], r[1], r[0] < 2 ? 6 : 96)),
          basic({ color: new T.Color(r[2]), transparent: true, opacity: r[3],
            blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.05;
        base.add(ring);
      });
      var beam = new T.Mesh(keep(new T.CylinderGeometry(3.1, 0.75, RY, 48, 1, true)),
        basic({ color: 0x3de8ff, transparent: true, opacity: 0.07, blending: T.AdditiveBlending,
          depthWrite: false, side: T.DoubleSide }));
      beam.position.y = RY / 2;
      base.add(beam);
      var core = new T.Mesh(keep(new T.CylinderGeometry(0.14, 0.14, RY, 12, 1, true)),
        basic({ color: 0xff3d9a, transparent: true, opacity: 0.5, blending: T.AdditiveBlending, depthWrite: false }));
      core.position.y = RY / 2;
      base.add(core);

      reactor = new T.Group();
      reactor.position.y = RY;
      content.add(reactor);
      var flat = new T.Group();
      flat.rotation.x = -Math.PI / 2;
      reactor.add(flat);
      var innerRing = new T.Group();
      outerRing = new T.Group();
      ticks = new T.Group();
      flat.add(innerRing);
      flat.add(outerRing);
      flat.add(ticks);
      var R1 = 2.15, R2 = 3.0;
      [[R1, 0.3], [R2, 0.15]].forEach(function (r) {
        flat.add(new T.Mesh(keep(new T.TorusGeometry(r[0], r[1] * 0.35, 6, 120)),
          basic({ color: 0x6c5cff, transparent: true, opacity: 0.22, blending: T.AdditiveBlending, depthWrite: false })));
      });
      ticks.add(new T.Mesh(keep(new T.TorusGeometry(3.55, 0.018, 4, 200)),
        basic({ color: 0x3de8ff, transparent: true, opacity: 0.45, blending: T.AdditiveBlending, depthWrite: false })));
      var tickGeo = keep(new T.BoxGeometry(0.05, 0.28, 0.05));
      var tickMat = basic({ color: 0x3de8ff, transparent: true, opacity: 0.8, blending: T.AdditiveBlending, depthWrite: false });
      for (var k = 0; k < 36; k++) {
        var tk = new T.Mesh(tickGeo, tickMat);
        var a = k / 36 * Math.PI * 2;
        tk.position.set(Math.cos(a) * 3.55, Math.sin(a) * 3.55, 0);
        tk.rotation.z = a;
        if (k % 3) tk.scale.set(1, 0.45, 1);
        ticks.add(tk);
      }

      var groups = spendGroups(roots), total = 0, i, j;
      for (i = 0; i < groups.length; i++) total += groups[i].value;
      var SHADES = [0.92, 0.7, 0.52];
      if (total > 0) {
        var from = Math.PI / 2;
        for (i = 0; i < groups.length; i++) {
          var gp = groups[i];
          var span = gp.value / total * Math.PI * 2;
          var colorHex = EPIC_COLORS[gp.index % EPIC_COLORS.length];
          arc(innerRing, R1, 0.27, from, span, colorHex, {
            title: gp.label,
            lines: [[i18n('tip_ring_inner')], [i18n('tip_spent'), i18n('n_credits', { c: fmtCr(gp.value) })],
              [i18n('tip_share'), Math.round(gp.value / total * 100) + '%']],
            click: gp.focus ? (function (f) { return function () { hooks.focusEpic(f); }; }(gp.focus)) : null
          });
          var ksum = 0;
          for (j = 0; j < gp.kids.length; j++) ksum += gp.kids[j].value;
          var at = from;
          for (j = 0; j < gp.kids.length && ksum > 0; j++) {
            var ks = span * (gp.kids[j].value / ksum);
            var shade = new T.Color(colorHex).lerp(new T.Color(0x0c0a1d), 1 - SHADES[j % 3]);
            arc(outerRing, R2, 0.14, at, ks, '#' + shade.getHexString(), {
              title: gp.label + DOT + gp.kids[j].label,
              lines: [[i18n('tip_ring_outer')], [i18n('tip_spent'), i18n('n_credits', { c: fmtCr(gp.kids[j].value) })],
                [i18n('tip_share'), Math.round(gp.kids[j].value / total * 100) + '%']]
            });

          }
          from += span;
        }
      }
      var mid = textSprite([i18n('n_credits', { c: fmtCr(total > 0 ? total : null) }), i18n('mid_spent')], COLOR.pink, 0.95);
      mid.position.y = RY + 1.05;
      mid.userData.wp = mid.position.clone();
      labels.push(mid);
      content.add(mid);
    }
    function arc(parent, radius, tube, start, span, colorHex, info) {
      var gap = Math.min(0.045, span * 0.18);
      var len = Math.max(0.02, span - gap);
      var segs = Math.max(6, Math.round(110 * len / (Math.PI * 2)));
      var m = new T.Mesh(keep(new T.TorusGeometry(radius, tube, 10, segs, len)),
        basic({ color: new T.Color(colorHex), transparent: true, opacity: 0.95,
          blending: T.AdditiveBlending, depthWrite: false }));
      m.rotation.z = start + gap / 2;
      parent.add(m);
      var base = m.material.color.clone();
      m.userData = {
        kind: 'arc',
        info: function () { return { title: info.title, color: colorHex, lines: info.lines }; },
        hover: function () { m.material.color.set(0xffffff); },
        unhover: function () { m.material.color.copy(base); },
        click: info.click
      };
      pickables.push(m);
    }

    function buildSkyline() {
      var n = 190;
      var tex = keep(windowTexture(32, 64, 0.38));
      tex.repeat.set(1, 5);
      var mat = keep(new T.MeshStandardMaterial({ color: 0x0b0920, metalness: 0.4, roughness: 0.7,
        emissive: 0x7048ff, emissiveMap: tex, emissiveIntensity: 0.55 }));
      var inst = keep(new T.InstancedMesh(BOX, mat, n));
      var o = new T.Object3D();
      var min = bound + 16;
      for (var i = 0; i < n; i++) {
        var a = rand() * Math.PI * 2, r = min + rand() * 70;
        var w = 2.4 + rand() * 4.2, h = 6 + Math.pow(rand(), 1.6) * 34;
        o.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        o.rotation.y = rand() * Math.PI;
        o.scale.set(w, h, w * (0.7 + rand() * 0.6));
        o.updateMatrix();
        inst.setMatrixAt(i, o.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
      content.add(inst);
    }

    function buildRain() {
      var n = 1200, span = bound * 3.2;
      var pos = new Float32Array(n * 3), v = [];
      for (var i = 0; i < n; i++) {
        pos[i * 3] = (rand() - 0.5) * span;
        pos[i * 3 + 1] = rand() * 46;
        pos[i * 3 + 2] = (rand() - 0.5) * span;
        v.push(16 + rand() * 12);
      }
      var geo = keep(new T.BufferGeometry());
      geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      content.add(new T.Points(geo, keep(new T.PointsMaterial({ color: 0x9a8cff, size: 0.09, transparent: true, opacity: 0.5,
        depthWrite: false, blending: T.AdditiveBlending }))));
      return { geometry: geo, n: n, v: v };
    }
  }
  // ------------------------------------------------------------------ the HTML half

  var ALL = '__all__';

  //: were: the pill they chose, the rows they opened, the drawer they are reading.

  var costOpen = true;

  }

  }

    return b;
  }

    var h = el('div', 'pc-ph');

    return card;
  }
  function wroteTag() { return el('span', 'pc-agent', i18n('crewmate_wrote')); }
  //: The open board of the pill the reader picked, or null on the all-workstreams view.
  function scopedBoard() {
    if (view === ALL) return null;
    var list = streams();
    for (var j = 0; j < list.length; j++) if ((txt(list[j].id) || String(j)) === view) return list[j];
    return null;
  }

  //: The page's ONE way out: a line for the reader's chat box. The host fills the
  //: composer with it and sends nothing; the reader presses send.
  function act(text) {
    try { parent.postMessage({ type: 'kirocrew-dashboard:act', text: text }, '*'); }
    catch (e) { /* no host: the choice does nothing */ }
  }

  // ---- chips ----
  function verdictPill(t) {
    var v = txt(t.verdict), st = txt(t.status), word = null, color = null;
    if (v === 'pass') { word = i18n('vp_accepted'); color = COLOR.mint; }
    else if (v === 'fail') { word = i18n('vp_rejected'); color = COLOR.red; }
    else if (st === 'blocked') { word = i18n('vp_unblock'); color = COLOR.red; }

  function lookPill(t) {

  //: The PR, and what its build is doing, on one chip: "which PR" and "is it green" are

    var label = digits ? 'PR #' + digits[1] : pr;
    var c = checksOf(t), cls = 'pc-chip';

  //: How long an OPEN row has been quiet. A finished task stopped reporting because it

  // ---- header ----
  function renderHead(list, found, empty) {
    applyStatic();
    $('pc-eyebrow').textContent = i18n(api().subject === 'session' ? 'doing_session' : 'doing');
    $('pc-title').textContent = found ? (txt(found.goal) || txt(found.id) || DASH) : i18n('page_title');
    renderLive();

    var s = $('pc-sentence');
    clear(s);
    var pills = $('pc-pills');
    clear(pills);
    if (empty) return;
    function bit(strong, after) { s.appendChild(el('b', null, strong)); s.appendChild(document.createTextNode(after)); }
    if (found) {
      // ONE build, and the sentence reads its root: the board row's own numbers count
      // that board alone, and on a workstream with a nested board they would disagree
      // with the workstream row directly below.
      var root = buildTree(list, found)[0] || null;
      var need = needsYou(boardsUnder(list, found), scopeOf(found)).total;
      s.appendChild(document.createTextNode(i18n('sent_accepted')));
      bit(root ? root.done + ' / ' + root.total : DASH, i18n('sent_spent'));
      bit(fmtCr(root ? billTotal(root.bill) : credits(found)), i18n('sent_credits'));
      bit(String(need), i18n(need === 1 ? 'needs_you_suffix' : 'need_you_suffix'));
    } else {
      var open = 0, cr = null;
      list.forEach(function (b) {
        open += num(b.open) || 0;
        var c = credits(b);
        if (c !== null) cr = (cr || 0) + c;
      });
      var needAll = needsYou(list, null).total;
      bit(String(open), i18n('sent_in_flight'));
      bit(fmtCr(cr), i18n('sent_credits'));
      bit(String(needAll), i18n(needAll === 1 ? 'needs_you_suffix' : 'need_you_suffix'));
    }
    // Every pill counts the same thing, open tasks, over the same boards the In flight
    // count sums -- a workstream's own and every board under its tasks -- so the
    // workstream pills add up to the All pill and the All pill to In flight.
    function openIn(boards) { return boards.reduce(function (n, b) { return n + (num(b.open) || 0); }, 0); }
    function pill(id, label, count) {
      var b = btn('pc-pill pc-cut', label, function () { view = id; render(); });
      b.setAttribute('aria-current', view === id ? 'true' : 'false');
      b.title = i18nCount(count, 'n_open_task');
      b.appendChild(el('span', 'pc-pill-n', String(count)));
      return b;
    }
    pills.appendChild(pill(ALL, i18n('pill_all'), openIn(list)));
    rootBoards(list).forEach(function (b, i) {
      pills.appendChild(pill(txt(b.id) || String(i), txt(b.goal) || String(i), openIn(boardsUnder(list, b))));
    });
  }
  function scopeOf(board) { return { id: txt(board.id) || '', goal: txt(board.goal) || '' }; }

  //: Is anything still arriving, and as of when. The dot is the fold's own advance;
  //: the time is when THIS page last read, through Date.now() so one clock is read.
  function renderLive() {
    var lv = $('pc-live'), lt = $('pc-live-t');
    var since = sinceMs(txt(fields().last_entry_at));
    var live = since !== null && since < QUIET_MS;
    lv.hidden = false;
    lv.setAttribute('data-live', live ? 'true' : 'false');
    clear(lt);
    lt.appendChild(el('b', null, i18n(live ? 'live_yes' : 'live_no')));
    var d = new Date(Date.now());
    var hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    lt.appendChild(document.createTextNode('\u00a0\u00b7 ' + i18n('updated_at', { t: hh }) +
      (since === null ? '' : DOT + i18n('entry_ago', { t: fmtAgo(since) }))));
  }

  //: The record stopped advancing. Different from the host's own band, which says a
  //: FIELD did not resolve: here every field resolved and the log behind them went quiet.
  function renderStale() {

  function renderVerdict(vd) {
    var host = $('pc-verdict-host');
    clear(host);
    // The crewmate's one line about all of its work: a picked workstream shows only
    // its own record, so the verdict waits on the All view.

    var card = el('div', 'pc-verdict pc-cut');
    card.style.setProperty('--vc', VERDICTS[vd.state]);
    var top = el('div', 'pc-verdict-top');

  }

  function kpi(label, value, unit, sub, quiet, color, bar) {
    var c = el('div', 'pc-kpi pc-cut');
    c.style.setProperty('--kc', color);
    c.appendChild(el('div', 'pc-kpi-l', label));
    var v = el('div', 'pc-kpi-v', value);
    if (unit) v.appendChild(el('small', null, unit));
    c.appendChild(v);
    if (sub) c.appendChild(el('div', 'pc-kpi-s' + (quiet ? ' pc-quiet' : ''), sub));
    if (typeof bar === 'number') {
      var b = el('div', 'pc-kpi-bar'), f = el('i');

      b.appendChild(f);

  }
  //: In flight and Accepted count tasks; Needs you counts items, because it adds the
  //: crewmate's own raised items to the tasks that wait on the reader.
  function unit(n) { return i18n(n === 1 ? 'unit_item' : 'unit_items'); }
  function taskUnit(n) { return i18n(n === 1 ? 'unit_task' : 'unit_tasks'); }
  function renderKpis(list, found, empty) {
    var host = $('pc-kpis');
    clear(host);
    if (empty) return;
    var open = 0, acc = 0, total = 0, need, scopeWord;
    if (found) {
      var root = buildTree(list, found)[0];
      acc = root ? root.done : 0;
      total = root ? root.total : 0;
      (function walk(ns) {
        ns.forEach(function (n) { if (n.task && txt(n.task.state) === 'open') open++; walk(n.kids); });
      }(root ? root.kids : []));
      need = needsYou(boardsUnder(list, found), scopeOf(found));
      scopeWord = i18n('this_workstream');
    } else {
      list.forEach(function (b) { open += num(b.open) || 0; acc += num(b.accepted) || 0; total += num(b.total) || 0; });
      need = needsYou(list, null);
      // EPICS: a nested board is not a workstream of its own.
      scopeWord = i18nCount(rootBoards(list).length, 'n_workstream');
    }
    host.appendChild(kpi(i18n('kpi_in_flight'), String(open), taskUnit(open), scopeWord, true, COLOR.cyan));
    host.appendChild(kpi(i18n('kpi_accepted'), String(acc), taskUnit(acc), i18n('kpi_accepted_of', { a: acc, n: total }),
      true, COLOR.mint, total ? acc / total : 0));
    // "Of which", never "plus": the subtitle describes the same set the number counts.
    host.appendChild(kpi(i18n('kpi_needs_you'), String(need.total), unit(need.total),
      need.total
        ? (need.mine ? i18n('kpi_mine', { n: need.mine }) : i18n(need.total === 1 ? 'kpi_one_answer' : 'kpi_answers'))
        : i18n('kpi_nothing_waiting'), !need.total, COLOR.acid));
  }

  //: One swatch per state the towers in view carry, counted over the same tree the
  //: city draws, so the legend and the skyline agree.
  function renderLegend(list, found, empty) {
    var host = $('pc-legend');
    clear(host);
    if (empty || !city || !city.ok) return;
    var seen = {};
    (function walk(ns) {
      ns.forEach(function (n) {
        if (n.task) { var k = taskLook(n.task); seen[k] = (seen[k] || 0) + 1; }
        walk(n.kids);
      });
    }(buildTree(list, found || null)));
    host.appendChild(el('span', 'pc-legend-k', i18n('legend_tasks')));
    LOOK_ORDER.forEach(function (k) {

      var s = el('span');
      // The two looks that need a person carry a ring over their tower; so do their keys.
      var i = el('i', k === 'question' || k === 'blocked' ? 'pc-ringed' : null);
      i.style.setProperty('--c', TASK_LOOK[k].color);
      s.appendChild(i);
      s.appendChild(document.createTextNode(lookWord(k) + ' ' + seen[k]));
      host.appendChild(s);
    });
    host.appendChild(el('span', null, i18n('legend_height')));
    var w = el('span'), wi = el('i', 'pc-wire');
    wi.style.setProperty('--c', COLOR.slate);
    w.appendChild(wi);
    w.appendChild(document.createTextNode(i18n('legend_dashed')));
    host.appendChild(w);

    // what works there.

  }
  var COARSE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  //: The button names the action it takes, so it carries no pressed state: a label

  var playBtn = null, viewBtns = [];
  function playLabel() {
    if (!playBtn || !city) return;
    playBtn.textContent = i18n(city.playing() ? 'motion_pause' : 'motion_play');
  }
  //: The buttons are built once, so each render relabels them in the reader's language.
  function labelCtrl() {
    viewBtns.forEach(function (v) { v.b.textContent = i18n('view_' + v.key); });
    playLabel();
  }
  function renderCtrl() {
    var host = $('pc-ctrl');

  function renderLanes(board) {
    var host = $('pc-lanes-host');
    clear(host);
    if (!board) return;
    var reds = redLanes(board);
    if (!reds.length) return;
    // One pull request's checks: under a picked workstream they show only when one of
    // its tasks names that pull request.
    var scoped = scopedBoard();
    if (scoped && !prInScope(board.pr, boardsUnder(streams(), scoped))) return;
    var failed = reds.filter(function (l) { return txt(l.state) === 'fail'; }).length;
    var never = reds.length - failed;
    var card = el('section', 'pc-lanes pc-cut');
    card.setAttribute('aria-label', i18n('aria_lanes'));
    var h = el('div', 'pc-lanes-h');

    if (never) words.push(i18n('lanes_did_not_run', { n: never }));
    h.appendChild(el('b', null, words.join(', ')));

    if (board.pr) where.push(/^\d+$/.test(board.pr) ? 'PR #' + board.pr : board.pr);
    if (board.head) where.push('head ' + board.head);

    if (written('ci')) h.appendChild(wroteTag());
    card.appendChild(h);
    reds.forEach(function (l) {
      var nr = txt(l.state) === 'did_not_run';
      var row = el('div', 'pc-lane');
      // The mark says it too, not only the colour: a hue alone is not a word.
      var m = el('div', 'pc-lane-m', nr ? '\u25cb' : '\u2717');
      m.style.color = nr ? COLOR.mute : COLOR.red;
      row.appendChild(m);
      row.appendChild(el('div', 'pc-lane-n', txt(l.name)));
      row.appendChild(el('div', 'pc-lane-w', nr ? (txt(l.why) || i18n('lane_never_started')) : (txt(l.why) || '')));
      // Who can clear it, which decides whether the reader can act at all. Plain text:
      // a boxed chip here reads as a button, and it is not one.
      var owner = txt(l.owner);
      row.appendChild(el('span', 'pc-lane-o', i18n(nr ? 'rerun_it' : (owner === 'maintainer' ? 'owner_maintainer' : 'owner_yours'))));
      card.appendChild(row);
    });
    host.appendChild(card);
  }

  function prDigits(pr) {
    var m = /^#?(\d+)$/.exec(txt(pr) || '');
    return m ? m[1] : null;
  }
  function prInScope(pr, boards) {
    var want = prDigits(pr);
    if (!want) return false;
    return boards.some(function (b) { return tasksOf(b).some(function (t) { return prDigits(t.pr) === want; }); });
  }

  // ---- the needs-you desk ----
  function todoCard(list, scope) {
    var need = needsYou(list, scope);
    var parts = [];
    if (need.workers) parts.push(i18n('todo_from_workers', { n: need.workers }));
    if (need.mine) parts.push(i18n('todo_from_crewmate', { n: need.mine }));
    var card = panel(i18n('todo_title'), need.total
      ? i18n('todo_total', { n: need.total }) + (parts.length ? i18n('sep_colon') + parts.join(i18n('sep_comma')) : '')
      : '', 'pc-w7');
    var rows = need.rows;
    if (!rows.length && !need.total) {
      card.appendChild(el('p', 'pc-empty', i18n(scope ? 'todo_none_scoped' : 'todo_none')));
      return card;
    }
    function cardRow(row) {
      var it = el('article', 'pc-card pc-cut');
      it.style.setProperty('--kc', row.color);
      it.appendChild(el('span', 'pc-kind', row.word));
      it.appendChild(el('div', 'pc-card-t', row.text));
      if (row.brief && row.brief.length) {
        var dl = el('dl', 'pc-brief');
        row.brief.forEach(function (b) { dl.appendChild(el('dt', null, b[0])); dl.appendChild(el('dd', null, b[1])); });
        it.appendChild(dl);
      }
      if (row.why) {
        var head = headline(row.why);
        it.appendChild(el('div', 'pc-why', head));
        if (head.length < row.why.length) {
          var more = el('details', 'pc-raw');
          more.appendChild(el('summary', null, W('words')));
          more.appendChild(el('div', null, row.why));
          it.appendChild(more);
        }
      }
      var meta = el('div', 'pc-where');
      if (row.where) meta.appendChild(el('span', null, row.where));
      if (row.agent && written('for_you')) meta.appendChild(wroteTag());
      if (meta.firstChild) it.appendChild(meta);
      var opts = el('div', 'pc-opts');
      row.choices.forEach(function (c) {
        var b = btn('pc-opt pc-cut' + (c.rec ? ' pc-rec' : '') + (c.own ? ' pc-own' : ''), c.label, function () {
          act(c.say);
          deskPicked[row.key] = c.own ? W('own') : c.label;
          it.classList.add('pc-going');
          setTimeout(render, 170);
        });
        b.title = c.say;
        if (!c.hint) { opts.appendChild(b); return; }
        // A choice that sounds final says what it asks for, right under it.
        var cell = el('span', 'pc-opt-cell');
        cell.appendChild(b);
        cell.appendChild(el('span', 'pc-opt-hint', c.hint));
        opts.appendChild(cell);
      });
      it.appendChild(opts);
      // Every card with buttons says, right under them, that a press only fills the
      // chat box: "Go ahead" sounds as final as "Drop it" to a reader who has not tried one.
      if (row.choices.length) it.appendChild(el('div', 'pc-opt-note', W('fills_only')));
      return it;
    }
    function shelf(shelfRows, label) {
      if (!shelfRows.length) return null;
      var wrap = el('div');
      if (label) wrap.appendChild(el('div', 'pc-shelf-h', label));
      var box = el('div', 'pc-cards');
      var counts = {}, seen = {};
      shelfRows.forEach(function (r) {
        if (!r.spender || !r.boardId) return;
        var k = r.boardId + '\u0000' + r.spender;
        counts[k] = (counts[k] || 0) + 1;
      });
      shelfRows.forEach(function (r) {
        var k = r.boardId + '\u0000' + r.spender;
        if (r.spender && r.boardId && counts[k] >= 2 && !own(seen, k)) {
          seen[k] = true;
          box.appendChild(el('div', 'pc-shelf-h', i18n('worker_asked', { w: r.spender, n: counts[k] })));
        }
        box.appendChild(cardRow(r));
      });
      wrap.appendChild(box);
      return wrap;
    }
    function fold(label, n, body) {
      var d = el('details', 'pc-fold');
      d.appendChild(el('summary', null, label + DOT + n));
      d.appendChild(body);
      return d;
    }
    var picked = rows.filter(function (r) { return own(deskPicked, r.key); });
    var open = rows.filter(function (r) { return !own(deskPicked, r.key); });
    var desk = el('div', 'pc-desk');
    var freshRows = open.filter(function (r) { return r.isNew; });
    // Each shelf names its count, so the cards on screen add up to the Needs you total.
    var fresh = shelf(freshRows, i18n('shelf_new') + DOT + freshRows.length);
    if (fresh) desk.appendChild(fresh);
    var olderRows = open.filter(function (r) { return !r.isNew; });
    var older = shelf(olderRows, '');
    if (older) desk.appendChild(fold(W('earlier'), olderRows.length, older));
    if (!open.length && picked.length) desk.appendChild(el('p', 'pc-empty', i18n('todo_nothing_left')));
    if (picked.length) {
      var ps = el('div');
      picked.forEach(function (r) {
        var s = el('div', 'pc-sent');
        s.appendChild(el('b', null, r.text));
        s.appendChild(el('span', null, '\u2192 ' + deskPicked[r.key]));
        s.appendChild(btn(null, W('undo'), function () { delete deskPicked[r.key]; render(); }));
        ps.appendChild(s);
      });
      desk.appendChild(fold(W('answered'), picked.length, ps));
    }
    card.appendChild(desk);
    // A truncated list says so: the fold can know of more than the page can draw.
    if (need.total > rows.length) {
      card.appendChild(el('div', 'pc-held', i18n('desk_cut', { n: need.total - rows.length })));
    }
    return card;
  }

  // ---- who is working ----
  function crewCard(list) {

    var card = panel(i18n('crew_title'), rows.length
      ? i18n('crew_cap_open', { w: i18nCount(rows.length, 'n_worker') })

    }
    var box = el('div', 'pc-crew');
    var shown = crewShowAll ? rows.length : Math.min(rows.length, CREW_CAP);
    rows.slice(0, shown).forEach(function (r) {
      var key = crewState(r.t), spec = CREW_STATES[key];
      var row = el('div', 'pc-crew-r');
      row.style.setProperty('--rc', spec[1]);

      row.appendChild(el('span', 'pc-crew-who', i18n('worker_n', { w: r.who })));

    }
    svg.appendChild(svgEl('line', { x1: padL, x2: w - padR, y1: padT + plotH, y2: padT + plotH, stroke: '#6c5cff', 'stroke-width': '1' }));
    var i;

        var rect = svgEl('rect', { x: bx.toFixed(1), y: by.toFixed(1), width: barW.toFixed(1), height: bh.toFixed(1),
          fill: 'rgba(255,61,154,0.22)', stroke: COLOR.pink, 'stroke-width': '1.2' });

    var every = Math.max(1, Math.ceil(points.length / Math.max(2, Math.floor(w / 64))));

    if (ran) chips.appendChild(ran);
    chips.appendChild(el('span', 'pc-chip', i18n('n_credits', { c: fmtCr(credits(t)) })));
    if (txt(t.spender)) chips.appendChild(el('span', 'pc-chip', i18n('worker_n', { w: txt(t.spender) })));
    p.appendChild(chips);
    function section(label, value, empty) {
      var s = el('div', 'pc-dr-sec');
      s.appendChild(el('div', 'pc-dr-k', label));
      s.appendChild(value ? el('div', 'pc-dr-v', value) : el('div', 'pc-dr-none', empty));
      return s;
    }
    p.appendChild(section(i18n('dr_said'), txt(t.summary), i18n('dr_said_empty')));
    p.appendChild(section(i18n('dr_decided'), txt(t.decision), i18n('dr_decided_empty')));
    p.appendChild(section(i18n('dr_verdict'), txt(t.verdict), i18n('dr_verdict_empty')));
    var out = [];
    if (txt(t.pr)) out.push(i18n('pull_request') + ' #' + txt(t.pr).replace(/^#/, ''));
    if (txt(t.state) === 'accepted') out.push(i18n('accepted_by'));
    p.appendChild(section(i18n('dr_result'), out.join(DOT), i18n('dr_result_empty')));
    var lanes = el('div', 'pc-dr-sec');
    lanes.appendChild(el('div', 'pc-dr-k', i18n('dr_lanes')));
    var board = ciBoard();
    var mine = board && board.pr && txt(t.pr) && board.pr.replace(/^#/, '') === txt(t.pr).replace(/^#/, '') ? redLanes(board) : [];
    if (!mine.length) {
      var c = checksOf(t);
      lanes.appendChild(el('div', 'pc-dr-none', i18n(c && c.fail === 0 && c.pass > 0 ? 'dr_lanes_green' : 'dr_lanes_none')));
    } else {
      mine.forEach(function (l) {
        var nr = txt(l.state) === 'did_not_run';
        var row = el('div', 'pc-dr-e');
        row.appendChild(el('div', 'pc-dr-e-m', nr ? '\u25cb' : '\u2717'));
        var xx = el('div', null, txt(l.name));
        var why = txt(l.why) || (nr ? i18n('lane_never_started_short') : '');
        if (why) xx.appendChild(el('div', 'pc-dr-e-k', why));
        row.appendChild(xx);
        lanes.appendChild(row);
      });
    }
    p.appendChild(lanes);
    var evs = Array.isArray(t.events) ? t.events.filter(function (r) { return r && typeof r === 'object'; }) : [];
    var seen = num(t.events_seen) || 0;
    var es = el('div', 'pc-dr-sec');
    // Says how many there were when it carries fewer, so a cut list is never read as whole.
    es.appendChild(el('div', 'pc-dr-k', i18n('events_label') +
      (evs.length < seen ? DOT + i18n('n_of_m', { n: evs.length, m: seen }) : (seen ? DOT + seen : ''))));
    if (!evs.length) {
      es.appendChild(el('div', 'pc-dr-none', seen ? i18nCount(seen, 'ev_recorded') : i18n('ev_none')));
    } else {
      evs.forEach(function (r) {
        var row = el('div', 'pc-dr-e');
        row.appendChild(el('div', 'pc-dr-e-m', hourLabel(r.at) || DASH));
        var xx = el('div', null, txt(r.text) || DASH);
        var mark = [txt(r.kind), txt(r.status)].filter(Boolean).join(DOT);
        if (mark) xx.appendChild(el('div', 'pc-dr-e-k', mark));
        row.appendChild(xx);
        es.appendChild(row);
      });
    }
    p.appendChild(es);
    host.appendChild(back);
    host.appendChild(p);
    if (focusIt) x.focus();
  }

  // ---- the accounting line ----
  function put(name, value) {
    var n = document.querySelector('[data-dashboard-field="' + name + '"]');
    if (n) n.textContent = value;
  }
  //: Each bound cell rewritten as words: the host fills them with the raw value, and
  //: an array's JSON is unreadable in a sentence.
  function renderNote(list, empty, vd, board) {
    $('pc-note').hidden = empty;
    var omitted = num(fields().omitted);
    var since = sinceMs(txt(fields().last_entry_at));
    // The workstreams the pills name, and apart from them the boards a task's own worker
    // runs, so this count agrees with the In flight card's "N workstreams".
    var roots = rootBoards(list).length, nested = list.length - roots;
    put('items', i18nCount(roots, 'n_workstream') + (nested ? i18n('note_nested', { n: nested }) : ''));
    put('omitted', i18n('note_omitted', { n: omitted === null ? DASH : omitted }));
    put('series', i18nCount(seriesOf(fields()).length, 'note_series'));
    put('for_you', i18nCount(forYou().length, 'note_for_you'));
    put('verdict', i18n('note_verdict', { v: vd ? i18n('verdict_' + vd.state).toLowerCase() : DASH }));
    put('ci', board ? i18nCount(redLanes(board).length, 'n_red_lane') : i18n('note_ci_none'));
    put('last_entry_at', i18n('note_last_entry', { t: since === null ? DASH : fmtAgo(since) }));
  }

  // ---- views ----
  //: Nothing from any of the three records: no board, nothing waiting, no money.
  function isEmpty(list) {
    if (list.length) return false;
    if (needsYou(list, null).total) return false;
    return !seriesOf(fields()).some(function (p) { return (num(p.credits) || 0) > 0; });
  }
  function renderGlobal(list, empty) {
    var host = $('pc-view');
    clear(host);
    if (empty) {
      var c = panel(i18n('empty_title'), '');
      c.appendChild(el('p', 'pc-empty', i18n('empty_all')));
      c.appendChild(el('p', 'pc-empty', i18n('empty_hint')));
      host.appendChild(c);
      return;
    }
    if (!list.length) {
      // No board, but a record of something: what follows did not come from a board.
      var lead = panel(i18n('empty_title'), '');
      lead.appendChild(el('p', 'pc-empty', i18n('empty_no_tree')));
      host.appendChild(lead);
      var need = needsYou(list, null);
      if (need.total) host.appendChild(todoCard(list, null));
      var pts = seriesOf(fields());
      if (pts.some(function (p) { return (num(p.credits) || 0) > 0; })) host.appendChild(costCard(list, pts, i18n('cap_record'), ''));
      return;
    }
    host.appendChild(todoCard(list, null));
    host.appendChild(crewCard(list));
    host.appendChild(sectionTree(buildTree(list, null), false));
    host.appendChild(costCard(list, seriesOf(fields()), i18n('cap_all'), ''));
  }
  //: *list* comes in beside *s* because a nested board is a sibling row of the flat
  //: list, so the tree of one epic still needs the whole list to find what hangs under it.
  function renderStream(s, list) {
    var host = $('pc-view');
    clear(host);
    // The workstream's board AND every board under its tasks, the set its tree and its
    // header already count, so a blocked task on a nested board reaches the desk too.
    var boards = boardsUnder(list, s);
    var nodes = buildTree(list, s);
    var root = nodes[0] || null;
    host.appendChild(todoCard(boards, scopeOf(s)));
    host.appendChild(crewCard(boards));
    host.appendChild(pipelineCard(boards));
    host.appendChild(costCard(boards, mergedSeries(boards), i18n('cap_one'), 'pc-w7',
      root ? billTotal(root.bill) : undefined));
    host.appendChild(sectionTree(nodes, true));
  }

  function updateCity(list, found) {
    if (!city || !city.ok) return;
    try {
      city.update(list, found ? (txt(found.id) || '') : '');
    } catch (e) {
      // The HTML half stands on its own: a scene that cannot draw this record says so
      // and leaves every number below in place.
      city = null;
      var box = $('pc-city');
      clear(box);
      box.setAttribute('data-gl', 'off');
      box.appendChild(el('p', 'pc-nogl', i18n('city_draw_failed')));
      renderCtrl();
      $('pc-legend').textContent = '';
    }
  }

  function render() {
    var list = streams();
    plots = [];
    var found = null;
    if (view !== ALL) {
      for (var j = 0; j < list.length; j++) {
        if ((txt(list[j].id) || String(j)) === view) { found = list[j]; break; }
      }
      if (!found) view = ALL;   // the fold dropped the board this pill named
    }
    var empty = !found && isEmpty(list);
    var vd = verdict(), board = ciBoard();
    // Before the tree is built: a row cannot ask whether it changed while being built.
    flashes = flashed(list);
    renderHead(list, found, empty);
    renderStale();
    renderVerdict(vd);
    renderKpis(list, found, empty);
    renderLegend(list, found, empty);
    renderLanes(board);
    if (found) renderStream(found, list); else renderGlobal(list, empty);
    renderNote(list, empty, vd, board);
    renderDrawer(false);
    drawPlots();
    labelCtrl();
    updateCity(list, found);
  }

  function boot() {
    render();
    try {
      city = makeCity($('pc-city'), {
        openTask: function (key) { openDrawer(key, null); },
        focusEpic: function (f) { view = f; render(); },
        motion: function () { playLabel(); }
      });
    } catch (e) {
      city = null;
      var box = $('pc-city');
      clear(box);
      box.setAttribute('data-gl', 'off');
      box.appendChild(el('p', 'pc-nogl', i18n('city_start_failed')));
    }
    renderCtrl();
    render();
    // On every push, and once more after the document is parsed: the host's first fill
    // runs on DOMContentLoaded, after this script, and writes every bound cell from the
    // raw value. All three on `window`, registered after the host's, so its fill goes
    // first and the page's own words win.
    //
    // ONE render per host push. The host answers its own data message by refilling and
    // then dispatching `kirocrew-dashboard`, so that event is the push; rendering on
    // the message as well would redraw a second time and drop the flash the first
    // render put on each row that moved.
    window.addEventListener('message', function (ev) {
      if (ev && ev.data && ev.data.type === 'kirocrew-dashboard:data') return;
      render();
    });
    window.addEventListener('DOMContentLoaded', function () { render(); });
    window.addEventListener('kirocrew-dashboard', function () { render(); });
    // Escape closes the drawer and nothing else.
    window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && drawerAt) closeDrawer(); });
    var timer = 0;
    window.addEventListener('resize', function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(drawPlots, 140);
    });
  }
  boot();
}());
</script>
